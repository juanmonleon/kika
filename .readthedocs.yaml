version: 2

build:
  os: ubuntu-22.04
  tools:
    python: "3.12"

sphinx:
  configuration: docs/source/conf.py
  # docs/WRITING_DOCS.md §8: a page is built with warnings as errors.
  fail_on_warning: true

python:
  install:
    - method: pip
      path: .
    - requirements: docs-requirements.txt

formats:
  - pdf
  - epub
